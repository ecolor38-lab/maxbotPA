name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Тестирование и линтинг
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run linter
        run: npm run lint
      
      - name: Check code formatting
        run: npm run format:check
      
      - name: Verify imports
        run: node -e "import('./src/index.js').then(() => console.log('OK'))"

  # Проверка безопасности
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'
      
      - name: Run security audit
        run: npm audit --audit-level=moderate
        continue-on-error: true
      
      - name: Check for vulnerable dependencies
        run: npx audit-ci --moderate

  # Проверка сборки
  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [test, security]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Verify server can start
        run: |
          timeout 30 npm run server || exit_code=$?
          if [ $exit_code -eq 124 ]; then
            echo "Server started successfully (timeout as expected)"
            exit 0
          else
            echo "Server failed to start"
            exit 1
          fi
        env:
          MAX_BOT_TOKEN: test_token_for_ci
          ANTHROPIC_API_KEY: test_key_for_ci
          PORT: 3001

  # Деплой на VPS (только для main ветки)
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [test, security, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/maxbot
            git pull origin main
            npm ci --production
            pm2 restart ecosystem.config.cjs
            pm2 save

      - name: Health check
        run: |
          sleep 5
          curl -sf "http://${{ secrets.VPS_HOST }}:3000/health" || echo "Health check failed (may need time)"

  # Создание релиза (при наличии тега)
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [test, security, build]
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false

